global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9091"]

  - job_name: "node"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # Layer A: Local Gateway (Router 10.0.0.1) - Scrape every 15s
  - job_name: "gateway"
    metrics_path: /probe
    params:
      module: [icmp]
    scrape_interval: 15s
    static_configs:
      - targets: ["10.0.0.1"]
        labels:
          layer: "A-gateway"
          name: "Orbi Router"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Layer B: External WAN IPs (Cloudflare 1.1.1.1, Google 8.8.8.8) - Scrape every 30s
  - job_name: "wan-ip"
    metrics_path: /probe
    params:
      module: [icmp]
    scrape_interval: 30s
    static_configs:
      - targets: ["1.1.1.1"]
        labels:
          layer: "B-wan-ip"
          name: "Cloudflare (1.1.1.1)"
      - targets: ["8.8.8.8"]
        labels:
          layer: "B-wan-ip"
          name: "Google (8.8.8.8)"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Layer C: DNS Resolution (Router, Cloudflare, Google) - Scrape every 60s
  - job_name: "wan-dns"
    metrics_path: /probe
    params:
      module: [dns_udp]
    scrape_interval: 60s
    static_configs:
      - targets: ["10.0.0.1:53"]
        labels:
          layer: "C-dns"
          name: "Router DNS (10.0.0.1)"
      - targets: ["1.1.1.1:53"]
        labels:
          layer: "C-dns"
          name: "Cloudflare DNS (1.1.1.1)"
      - targets: ["8.8.8.8:53"]
        labels:
          layer: "C-dns"
          name: "Google DNS (8.8.8.8)"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Layer D: External Web / HTTPS - Scrape every 60s
  - job_name: "wan-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 60s
    static_configs:
      - targets: ["https://www.google.com"]
        labels:
          layer: "D-wan-http"
          name: "Google HTTPS"
      - targets: ["https://1.1.1.1"]
        labels:
          layer: "D-wan-http"
          name: "Cloudflare HTTPS"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # LAN Hosts (Windows PC, 3D Printer) - Scrape every 30s
  - job_name: "lan-hosts"
    metrics_path: /probe
    params:
      module: [icmp]
    scrape_interval: 30s
    static_configs:
      - targets: ["10.0.0.21"]
        labels:
          role: "workstation"
          name: "Windows Desktop"
      - targets: ["10.0.0.124"]
        labels:
          role: "printer"
          name: "Bambu P1S Printer"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # LAN Services (Ollama, SSH) - Scrape every 60s
  - job_name: "lan-services"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    scrape_interval: 60s
    static_configs:
      - targets: ["10.0.0.21:11434"]
        labels:
          service: "ollama"
          name: "Ollama LLM (Windows)"
      - targets: ["10.0.0.21:22"]
        labels:
          service: "ssh"
          name: "SSH Server (Windows)"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
