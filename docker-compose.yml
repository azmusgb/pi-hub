version: '3.8'

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: netmon-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /mnt/usb1:/mnt/usb1:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)'

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: netmon-blackbox-exporter
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    volumes:
      - /opt/netmon/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: netmon-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/netmon/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/netmon/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - /mnt/usb1/netmon/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=180d'
      - '--web.listen-address=0.0.0.0:9091'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: netmon-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - /opt/netmon/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - /opt/netmon/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - /opt/netmon/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - /mnt/usb1/netmon/grafana:/var/lib/grafana

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: netmon-uptime-kuma
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=3001
    volumes:
      - /mnt/usb1/netmon/uptime-kuma:/app/data
