# Pi Hub: the Pi's own bridge moves to port 8092; the failover service answers on 8091
# and falls back to the MacBook's bridge when the Pi's has no fresh frame.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -u /opt/x2d-bridge/x2d_camera_bridge.py --rtsp-url-file /etc/x2d-bridge/rtsp-url --ffmpeg /usr/bin/ffmpeg --bind 127.0.0.1 --port 8092
