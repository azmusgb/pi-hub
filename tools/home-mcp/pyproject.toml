[project]
name = "home-mcp"
version = "0.1.0"
description = "Typed, bounded tools for the home systems, served to Claude Code over stdio"
authors = [
    { name = "azmusgb", email = "36898133+azmusgb@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
]

[project.scripts]
home-mission = "home_mcp.mission.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
