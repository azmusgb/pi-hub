http:
  pprof:
    port: 6060
    enabled: false
  doh:
    routes:
      - GET /dns-query
      - POST /dns-query
    insecure_enabled: false
  address: 0.0.0.0:3002
  session_ttl: 30d
users: []
auth_attempts: 5
theme: auto
dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  anonymize_client_ip: false
  ratelimit: 20
