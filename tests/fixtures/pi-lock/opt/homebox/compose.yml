# Homebox: home and workshop inventory (tools, parts, appliances, warranties). Filament stays in Bambuddy.
name: homebox
services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    restart: unless-stopped
    ports:
      - "7745:7745"
    env_file: homebox.env
    environment:
      HBOX_LOG_LEVEL: info
      HBOX_OPTIONS_ALLOW_REGISTRATION: "${HBOX_ALLOW_REGISTRATION:-false}"
      HBOX_OPTIONS_CHECK_GITHUB_RELEASE: "false"
      TZ: America/New_York
    volumes:
      - /mnt/usb1/homebox:/data
